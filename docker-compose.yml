# Local stack: the app plus a Prometheus scraper, so the metrics you added are
# visible in development rather than only in production.
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      ENVIRONMENT: local
      LOG_FORMAT: console
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
