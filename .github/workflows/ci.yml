name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -----------------------------------------------------------------------
  # Fast feedback: lint, type-check, test. No secrets needed — the app runs in
  # stub mode, so the whole suite is hermetic and costs nothing in API spend.
  # -----------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    env:
      LLM_OFFLINE_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report.xml

  # -----------------------------------------------------------------------
  # Build once, scan, push by digest. Deploys reference the digest, not a
  # mutable tag, so what was tested is exactly what runs.
  # -----------------------------------------------------------------------
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"   # report first; flip to "1" to gate once the base is clean
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif

      - name: Smoke test the built image
        run: |
          docker run -d --name smoke -p 8000:8000 -e LLM_OFFLINE_MODE=true \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break || sleep 2
          done
          curl -fsS -X POST http://localhost:8000/v1/feedback/analyze \
            -H 'content-type: application/json' \
            -d '{"items":[{"id":"1","text":"the export crashes"}],"dry_run":true}' \
            | grep -q executive_summary
          docker rm -f smoke

  # -----------------------------------------------------------------------
  # Deploy. `environment: production` is where you attach the manual approval
  # gate and the production secrets in repo settings.
  # -----------------------------------------------------------------------
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write     # OIDC -> AWS: no long-lived keys in GitHub
      contents: read
    steps:
      - uses: actions/checkout@v4

      # --- Option A: AWS ECS Fargate ---------------------------------------
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2
      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster feedbackiq-prod \
            --service feedbackiq \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster feedbackiq-prod --services feedbackiq

      # --- Option B: Render (swap in place of the two steps above) ----------
      # - name: Trigger Render deploy
      #   run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Post-deploy smoke test
        run: curl -fsS "${{ secrets.PROD_BASE_URL }}/readyz" | grep -q '"status":"ready"'
